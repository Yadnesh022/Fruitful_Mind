<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#592d6c" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <title>Fruitful Mind | Discover The Curious You | Simran Mistry - Psychologist Pune</title>
    <meta
      name="description"
      content="Fruitful Mind by Simran Mistry, Psychologist in Kothrud, Pune. Safe, compassionate counselling for anxiety, overthinking, career growth, and psychology tuition."
    />
  </head>
  <body class="bg-brand-canvas-light text-brand-plum-900 antialiased selection:bg-brand-peach-200 selection:text-brand-plum-950 dark:bg-brand-canvas-dark dark:text-brand-plum-50">
    <!-- SVG Defs for Apple-style Liquid Glass Displacement -->
    <svg class="sr-only" aria-hidden="true">
      <defs>
        <!-- Liquid Glass Refraction Filter -->
        <filter id="liquid-refract" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.04"
            numOctaves="2"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="4"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <!-- Soft Chromatic Refraction Filter -->
        <filter id="liquid-glass-subtle" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence
            type="turbulence"
            baseFrequency="0.02"
            numOctaves="1"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="2"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
